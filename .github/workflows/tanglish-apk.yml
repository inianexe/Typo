name: Tanglish keyboard APK
on:
  push:
    branches: [codex/tanglish-keyboard-v1]
    paths:
      - "mobile-tanglish/**"
      - ".github/workflows/tanglish-apk.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - name: Build debug APK
        run: gradle --no-daemon -p mobile-tanglish assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Tanglish-Rewrite-debug-apk
          path: mobile-tanglish/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
